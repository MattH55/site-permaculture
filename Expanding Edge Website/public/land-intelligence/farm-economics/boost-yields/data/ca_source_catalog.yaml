# ca_source_catalog — Canadian analogue of `ams_report_catalog` (v2 §1.3 / §2.3).
#
# This is a *catalog of places to look*, not a claim that any price was retrieved. In the
# v1 tradition, a source that has not been retrieved stays enabled:false with a reason so
# "not yet retrieved" is distinguishable from "retrieved and empty". Freshness of every
# URL must be verified before use; these are starting points from the research session,
# not permanently stable endpoints.
#
# Tier vocabulary is the CANADIAN hierarchy (v2 §1.3), which is parallel to — not a
# relabel of — the U.S. one:
#   CA Tier A  = Statistics Canada
#   CA Tier B  = provincial ag ministries (Alberta)  [sub-federal, PDF, single-jurisdiction]
#   CA Tier B2 = AAFC market/sector reports
#   CA Tier C  = Census of Agriculture (aggregate value, not price)
#   CA Tier D  = trade data (StatCan trade tables / UN Comtrade)
#   CA Tier E  = no source
#
# Note (v2 §1.4): Alberta's provincial ag-ministry publications are the Canadian analogue
# of U.S. Tier B2, but are classified as CA Tier B — in Canada there is no separate federal
# AMS-equivalent terminal-market program above them for most of these commodities, so they
# are the top tier actually available for prairie crops.
