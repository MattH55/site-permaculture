# ============================================================================
# wide_source_catalog.yaml — v3 §30 master source catalog
#
# A catalog of *places price data credibly exists*, not of retrieved observations.
# Every entry carries the §30 fields plus matching metadata (crop_groups / crops /
# env_key / market_level) used by wide_source_discovery.
#
# HONESTY CONTRACT: nothing here is fetched in this build. access_status records *why*
# (requires_key / manual_only / disabled-no-parser). A catalog entry must never be read
# as evidence of a price — only as a defensible place to look (§2, §45).
#
# crop_groups values: "all" = any seed crop; otherwise a subset of the v2 closed group
# taxonomy. crops: explicit seed-crop keys for commodity-specific sources (§1.5).
# ============================================================================
catalog_version: "3.0"
last_checked: "2026-09-16"

