# ------------------------------------------------------------- §48/§49 candidate crops
# Commodity universes from which the candidate-crop generator draws. Terms here are
# catalog metadata (names known to appear in each universe's publications); the heuristic
# tags (§49) decide candidacy, and a human confirms before any crop enters the seed list.
commodity_universes:
  nass_specialty:
    - {name: "hops", source: "NASS Hops annual report", tags: ["specialty"]}
    - {name: "honey", source: "NASS Honey annual report", tags: ["specialty"]}
    - {name: "mint oil", source: "NASS Prices Received", tags: ["essential_oil"]}
    - {name: "hemp", source: "NASS Hemp (specialty)", tags: ["fiber", "specialty"]}
    - {name: "floriculture crops", source: "NASS Floriculture Crops", tags: ["floriculture"]}
    - {name: "nursery crops", source: "NASS Census of Horticultural Specialties", tags: ["nursery"]}
  ams_specialty:
    - {name: "lemongrass", source: "AMS specialty herbs reports", tags: ["herb", "aromatic"]}
    - {name: "galangal", source: "AMS specialty roots reports", tags: ["root_crop", "spice"]}
    - {name: "kaffir lime leaves", source: "AMS specialty herbs reports", tags: ["herb", "leaf"]}
    - {name: "moringa", source: "AMS specialty greens reports", tags: ["leaf", "medicinal"]}
    - {name: "edible flowers", source: "AMS specialty reports", tags: ["edible_flower"]}
    - {name: "sprouts", source: "AMS specialty reports", tags: ["sprout"]}
    - {name: "truffles", source: "AMS specialty reports", tags: ["mushroom", "high_value"]}
  faostat_items:
    - {name: "quinoa", source: "FAOSTAT crops item list", tags: ["pseudocereal"]}
    - {name: "agave", source: "FAOSTAT crops item list", tags: ["specialty"]}
    - {name: "vanilla", source: "FAOSTAT crops item list", tags: ["spice", "high_value"]}
    - {name: "cardamom", source: "FAOSTAT crops item list", tags: ["spice", "high_value"]}
    - {name: "saffron", source: "FAOSTAT crops item list (via spices aggregate)", tags: ["spice", "high_value"]}
    - {name: "ginseng", source: "FAOSTAT crops item list (via roots)", tags: ["medicinal", "root_crop"]}
