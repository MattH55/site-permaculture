  - source_id: afsc_spring_adjusted
    title: "2026 Spring Insurance Prices for Crops Eligible for Fall Insurance Price Adjustments"
    publisher: "Alberta Farm Service Corporation (AFSC)"
    price_type: insurance_reference_price
    enabled: true
    kind: pdf
    parser: afsc_spring
    geography: [Alberta]
    document_url: "https://afsc.ca/crop-insurance/insurance-prices/"
    download_url: "https://afsc.ca/wp-content/uploads/2026/02/2026-Spring-Insurance-Prices-for-Crops-Eligible-for-Fall-Insurance-Price-Adjustments.pdf"
    raw_name: "afsc_spring_adjust_2026.pdf"
    layout_note: >
      Two-page grid. Columns are Commercial $/kg, Commercial $/bu(lbs), Pedigreed $/kg,
      Pedigreed $/bu(lbs), then two % change columns. A trailing "*" on a $/bu value
      means the printed figure is $/pound, per the page footnote. Crop label and its
      numeric row often land on separate reconstructed lines and must be paired.

  - source_id: afsc_spring_not_adjusted
    title: "2026 Spring Insurance Prices for Crops Not Eligible for Fall Insurance Price Adjustments"
    publisher: "Alberta Farm Service Corporation (AFSC)"
    price_type: insurance_reference_price
    enabled: true
    kind: pdf
    parser: afsc_spring
    geography: [Alberta]
    document_url: "https://afsc.ca/crop-insurance/insurance-prices/"
    download_url: "https://afsc.ca/wp-content/uploads/2026/03/2026-Spring-Insurance-Prices-for-Crops-Not-Eligible-for-Fall-Insurance-Price-Adjustments.pdf"
    raw_name: "afsc_spring_noadjust_2026.pdf"
    layout_note: >
      Same logical shape as the adjusted list but a DIFFERENT x-grid ($/kg and $/lbs
      pairs, plus a Spring Price column). Column assignment must be derived from this
      document's own header band, never from the adjusted document's coordinates.

  - source_id: afsc_agristability_other_crops
    title: "2026 AgriStability Commodity Price List - Other Crops"
    publisher: "Alberta Farm Service Corporation (AFSC)"
    price_type: insurance_reference_price
    enabled: true
    kind: pdf
    parser: afsc_agristability
    geography: [Alberta]
    document_url: "https://afsc.ca/income-stabilization/agristability/agristability-price-lists/"
    download_url: "https://afsc.ca/wp-content/uploads/2026/06/2026-Other-Crops-Price-List.pdf"
    raw_name: "afsc_othercrops_agristability_2026.pdf"
    layout_note: >
      Month-major: each crop block carries tonne/bushel price pairs in one column set.
      Header repeats "tonne" and "bushel" per crop, so unit is taken from the header
      column of the block, not inferred from magnitude. A second block is $/lb.

  - source_id: afsc_agristability_forage_seed
    title: "2026 AgriStability Commodity Price List - Forage Seed"
    publisher: "Alberta Farm Service Corporation (AFSC)"
    price_type: insurance_reference_price
    enabled: true
    kind: pdf
    parser: afsc_agristability_forage
    geography: [Alberta]
    document_url: "https://afsc.ca/income-stabilization/agristability/agristability-price-lists/"
    download_url: "https://afsc.ca/wp-content/uploads/2026/06/2026-Forage-Seed-Price-List.pdf"
    raw_name: "afsc_forage_seed_2026.pdf"
    layout_note: >
      Single $/lb grid, one row per species/grade, one column per month. Only Jan-Jul
      are populated in the June-vintage document; later months are genuinely blank.
      $/lb is mass-based so it converts cleanly to CAD/tonne.

  - source_id: alberta_cropping_alternatives_2026
    title: "2026 Cropping Alternatives: crop budget planning (AgriProfit$)"
    publisher: "Alberta Agriculture and Irrigation"
    price_type: expected_market_price
    enabled: true
    kind: pdf
    parser: cropping_alternatives
    geography: [Alberta]
    document_url: "https://open.alberta.ca/dataset/agriprofits-cropping-alternatives"
    download_url: "https://open.alberta.ca/dataset/64f607fb-d73c-407d-aa60-1f112be29777/resource/beba1d0f-6f22-4ab0-93ba-63930db5efb2/download/agi-tedab-cropping-alternatives-2026.pdf"
    raw_name: "cropping_alts_2026.pdf"
    unit_resolution: footnote-driven
    layout_note: >
      One soil-zone table per page (Black, Dark Grey Wooded, Brown, Grey Wooded,
      Dark Brown, Irrigated). Price row tokens sit at the SAME x positions as the
      yield row tokens, which gives the column mapping. Crop-name header words span
      two lines and a grade/class line. Units come from the per-page footnote:
      a bare column is $/bu, "*" is $/lb on some pages and $/tonne on others,
      "**" is $/tonne. The footnote MUST be read per page; it is not constant.
      The dataset spans 2014-2026 annual editions, so this is a longitudinal
      plan-time price series, not a single snapshot.

  - source_id: statscan_18100245
    title: "Monthly average retail prices for selected products"
    publisher: "Statistics Canada"
    pid: "18100245-01"
    price_type: retail_price
    enabled: true
    kind: statcan_zip
    parser: statcan
    geography: [Alberta]
    dimension_column: "Products"
    member_column: null
    select_members_containing: null
    coverage_warning: >
      Retail scanner prices. NOT farm-gate. Many Alberta members are package units
      (unit, 142 grams, 454 grams, 2 litres) that cannot be normalized to CAD/tonne;
      those rows are quarantined with a reason, never guessed at.
    table_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1810024501"
    download_url: "https://www150.statcan.gc.ca/n1/tbl/csv/18100245-eng.zip"
    raw_name: "18100245.zip"

# ---------------------------------------------------------------------------
# Registered but deferred (decision: NOT ingested in v1)
# ---------------------------------------------------------------------------
deferred_sources:
  - source_id: aafc_commodity_outlook
    title: "AAFC Analysis and Outlook - commodity price outlook"
    publisher: "Agriculture and Agri-Food Canada"
    price_type: aafc_outlook_price
    enabled: false
    reason: >
      AAFC publishes outlooks as PDF/HTML reports with no stable machine-readable
      price table, and the figures are forecasts rather than observations. Folding a
      forecast into the observation store requires its own uncertainty handling
      (published range + vintage). Deferred to the dedicated forecast layer, which
      futures-predicted-price-spec.md already models as instrument_type = "outlook"
      with a null-safe fallback.
    reference_urls:
      - "https://agriculture.canada.ca/en/international-research/market-analyses-reports/reports/reports-and-publications/ltc-price-outlook"
      - "https://agriculture.canada.ca/en/international-research/market-analyses-reports/reports/analysis-and-outlook"

  - source_id: aafc_infohort_weekly
    title: "AAFC Infohort weekly wholesale prices"
    publisher: "Agriculture and Agri-Food Canada"
    price_type: wholesale_price
    enabled: false
    reason: >
      Belongs to the horticulture/greenhouse layer rather than the field-crop
      specialty series. Ingest it in the produce pipeline so the package dimensions
      (variety, grade, origin, package weight, low/high range) survive instead of
      being flattened into a single tonne price.
    reference_urls:
      - "https://od-do.agr.gc.ca/WeeklyWholesalePrices_PrixDeGrossistesHebdomadaires.csv"
      - "https://od-do.agr.gc.ca/WeeklyWholesalePricesDictionaryEn.html"

  - source_id: alberta_table101
    title: "Table 101: Farm Supply and Disposition of Alberta Principal Field Crops"
    publisher: "Alberta Agriculture and Irrigation"
    price_type: trade_unit_value
    enabled: false
    reason: >
      Quantity table (opening stocks, production, marketings, seed, carryover,
      feed/waste/dockage). It carries no producer price series, so it belongs in the
      market-volume layer, not the price store.
    raw_name: "ab_table101_supply_disp.xlsx"

# ---------------------------------------------------------------------------
# Externalized by policy - citation only, never ingested
# ---------------------------------------------------------------------------
external_references:
  policy: >
    Commercial cash-bid and exchange data is licence-restricted. It is kept here as
    an explicit external reference so a user can pursue it under their own
    entitlement. No value from these sources may be written into
    data/price-observations, and none may be merged into an official
    average_farm_price figure.
  references:
    - reference_id: open_alberta_weekly_crop_market_review
      title: "Weekly crop market review (Alberta)"
      url: "https://open.alberta.ca/dataset?q=title%3A+%22Weekly+crop+market+review%22"
      kind: "public-market-commentary"
      values_included: false
      note: "Narrative commentary; any figures quoted there trace to third-party price reporting."
    - reference_id: commercial_elevator_cash_bids
      title: "Commercial elevator / broker cash bids"
      url: null
      kind: "commercial-cash-bid"
      values_included: false
      note: "Licence-restricted. Excluded from every normalized price series."
    - reference_id: exchange_futures_settlements
      title: "ICE Futures Canada / CME settled futures"
      url: null
      kind: "exchange-settlement"
      values_included: false
      note: >
        Exchange redistribution terms restrict republication. Handled as a separately
        labeled forecast layer (see futures-price-forecast-instructions.md), never as
        an observation row.
