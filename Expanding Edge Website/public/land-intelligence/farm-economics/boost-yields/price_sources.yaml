# Land Intelligence — Alberta specialty-crop price source registry
#
# Every source declares exactly one price_type. Rows are NEVER blended across
# price_type values; the frontend and every aggregate must filter on it first.
#
# `enabled: false` means registered-but-not-ingested (decision deferred).
# `values_included: false` means the source is externalized by policy: it is
# recorded as a citation only, and no number from it may enter the dataset.

version: 1
generated_for: "boost-yields / Alberta specialty-crop price pipeline"
default_licence_note: >
  Official government sources below are Open Government Licence - Canada or the
  province's equivalent open-data terms unless a source overrides it.

# ---------------------------------------------------------------------------
# Normalization target
# ---------------------------------------------------------------------------
normalization:
  target_currency: CAD
  target_unit: tonne            # metric tonne (1000 kg)
  keep_original: true           # original value + unit are always retained
  # Bushel mass is commodity-specific. There is no generic bu -> kg factor.
  # Resolution order for a $/bu observation:
  #   1. explicit metric twin series in the same source (preferred)
  #   2. commodity test weight declared by the source (Symbols sheet / NOTE line)
  #   3. crop_sales cross-check (yield x price == reported $/acre sales)
  #   4. quarantine — the row is written with normalized value null and a reason
  bushel_policy: explicit-only

# ---------------------------------------------------------------------------
# price_type taxonomy (closed)
# ---------------------------------------------------------------------------
price_types:
  average_farm_price:
    label: "Average farm price"
    definition: >
      Season-average price received by producers at the farm gate for the crop
      as a whole. Official statistics. Not a point-in-time quote.
    usable_for_farm_economics: true
  insurance_reference_price:
    label: "Crop insurance / AgriStability reference price"
    definition: >
      Administrative price set by AFSC (or a federal price review committee) for
      indemnity or program calculations. A policy parameter, not a transacted price.
    usable_for_farm_economics: false
    caveat: "Usable as an indexed floor / claims parameter only. Do not present as a price a farmer obtained."
  expected_market_price:
    label: "Expected market price (plan-time)"
    definition: >
      Price assumed in a cost-of-return budget at planning time. Forward-looking
      and assumption-driven; it embeds the author's marketing expectation.
    usable_for_farm_economics: false
    caveat: "Planning assumption. Must never be averaged with realized farm prices."
  retail_price:
    label: "Retail (scanner) price"
    definition: >
      Consumer point-of-sale price for a packaged product. Includes retail margin,
      processing and distribution. NOT a farm-gate price.
    usable_for_farm_economics: false
    caveat: "Never substitute for farm-gate. Package units are frequently not mass-based."
  wholesale_price:
    label: "Wholesale asking price"
    definition: >
      Wholesaler asking price at a named market, low-high range per package.
      Not a completed transaction and not farm-gate.
    usable_for_farm_economics: false
  terminal_local_price:
    label: "Terminal / local elevator feed-grain price"
    definition: >
      Published non-board (free market) price at a named Alberta delivery point.
      Elevator-side, before basis/handling; closer to farm-gate than retail, but
      still not a producer realization statistic.
    usable_for_farm_economics: false
    caveat: "Point-of-delivery price. Basis to an individual farm is not included."
  trade_unit_value:
    label: "Trade unit value (value / quantity)"
    definition: "Border price implied from customs value and quantity. A proxy, not a producer price."
    usable_for_farm_economics: false
  aafc_outlook_price:
    label: "AAFC price outlook"
    definition: "Model-based forward price published in AAFC Analysis & Outlook commodity outlooks."
    usable_for_farm_economics: false
    caveat: "A forecast, with an AAFC-published range where available. Label as forecast in UI."
  commercial_bid_reference_link:
    label: "Commercial cash bid (external reference only)"
    definition: >
      Licensed / restricted commercial elevator or exchange cash bid. Values are
      EXTERNALIZED BY POLICY and are never ingested into the normalized dataset.
    usable_for_farm_economics: false
    values_included: false


# ---------------------------------------------------------------------------
# Ingested sources
# ---------------------------------------------------------------------------
