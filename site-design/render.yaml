# Expanding Edge — Alberta site design (map → report)
#
# Deploy either:
#   A) Dashboard → New → Web Service → Root Directory: site-design
#      (this file is optional then; use the same build/start commands)
#   B) Blueprint with path site-design/render.yaml from the Expanding Edge repo
#      When Root Directory is already "site-design", do not also set rootDir here.
#
# https://dashboard.render.com

services:
  - type: web
    name: ee-site-design
    runtime: node
    # free = spins down after 15m idle (~1 min cold start)
    # Change to "starter" for always-on production (design.expandingedge.ca)
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Paste in Render Dashboard after create (do not commit the key)
      - key: GOOGLE_MAPS_API_KEY
        sync: false
