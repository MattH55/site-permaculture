<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Vegetation Model Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #223018; overflow: hidden; }
  canvas { display: block; }
  #label {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    font-family: monospace; font-size: 13px; color: #e8e0ff;
    background: rgba(10,15,20,0.75); padding: 8px 12px; border-radius: 6px;
    line-height: 1.6; max-width: 420px;
  }
</style>
</head>
<body>
<div id="label">loading…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="module">
import { indexVegetationManifest } from '/vegetation-assets.js';
import { scatterVegetation } from '/vegetation-scatter.js';
import { preloadVegetationAssets, mountVegetation } from '/vegetation-renderer.js';
import { DEFAULT_LOD_DISTANCES } from '/vegetation-lod.js';

const labelEl = document.getElementById('label');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x223018);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 500);
camera.position.set(5, 2, 6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(4, 8, 3);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshLambertMaterial({ color: 0x3a4a2e })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// --- Real pipeline: manifest -> registry -> scatterVegetation -> renderer ---
async function main() {
  // Served copy of the canonical assets/vegetation/manifest.json (repo root,
  // not web-servable) — see public/assets/vegetation/manifest.json's sync note.
  const manifest = await fetch('/assets/vegetation/manifest.json').then((r) => r.json());
  const { assets, byId, problems } = indexVegetationManifest(manifest);
  if (problems.length) console.warn('manifest problems:', problems);

  // A small demo plot — real lat/lon (a patch near Edmonton, AB), ~14m x 10m.
  const centerLat = 53.5461, centerLon = -113.4938;
  const dLat = 0.00006; // ~6.7m
  const dLon = 0.00010; // ~6.7m at this latitude
  const polygon = [
    [centerLon - dLon, centerLat - dLat],
    [centerLon + dLon, centerLat - dLat],
    [centerLon + dLon, centerLat + dLat],
    [centerLon - dLon, centerLat + dLat],
    [centerLon - dLon, centerLat - dLat],
  ];

  const instances = scatterVegetation({
    property: { id: 'demo-plot', polygon },
    assetIds: assets.map((a) => a.id),
    mode: 'natural',
    rules: { minSpacingMeters: 0.5, scaleRange: { min: 0.8, max: 1.3 } },
    randomSeed: 'vegetation-model-demo',
    maxCount: 60,
  });
  labelEl.textContent = `scatterVegetation(): ${instances.length} instances from ${assets.length} real assets — loading GLBs…`;

  const preloaded = await preloadVegetationAssets(instances, byId);

  const kmPerDegLat = 111.32;
  const kmPerDegLon = 111.32 * Math.cos((centerLat * Math.PI) / 180);
  const toLocal = (lat, lon) => ({
    x: (lon - centerLon) * kmPerDegLon * 1000,
    y: 0,
    z: -(lat - centerLat) * kmPerDegLat * 1000, // north = -z, matches the main viewer's convention
  });

  // Demo-scaled LOD thresholds — a 14x10m plot is smaller than the spec's
  // real 50m/200m defaults (DEFAULT_LOD_DISTANCES), which would keep every
  // instance in "high" tier for any camera position that could see the whole
  // plot. Shrunk here purely so orbiting in/out visibly crosses both
  // thresholds; the real defaults are what production code should use.
  const demoThresholds = { highMaxM: 4, mediumMaxM: 9 };

  const veg = mountVegetation(scene, instances, byId, {
    toLocal,
    metersPerSceneUnit: 1, // scene units ARE meters in this demo
    preloaded,
    lodThresholds: demoThresholds,
  });

  const speciesCounts = {};
  for (const inst of instances) {
    const a = byId.get(inst.assetId);
    speciesCounts[a?.commonName || inst.assetId] = (speciesCounts[a?.commonName || inst.assetId] || 0) + 1;
  }
  const countsStr = Object.entries(speciesCounts).map(([k, v]) => `${k}: ${v}`).join(' · ');
  labelEl.innerHTML = `<b>${instances.length} instances</b> · ${countsStr}<br/>` +
    `LOD (demo-scaled): high &lt;${demoThresholds.highMaxM}m, medium &lt;${demoThresholds.mediumMaxM}m, else hidden<br/>` +
    `<span id="tier-readout">orbit to see LOD switch…</span>`;
  const tierReadout = document.getElementById('tier-readout');

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    veg.update(camera);
    const distToCenter = camera.position.length().toFixed(1);
    tierReadout.textContent = `camera distance from plot center: ${distToCenter}m`;
    renderer.render(scene, camera);
  }
  animate();
}

main().catch((err) => { labelEl.textContent = 'ERROR: ' + err.message; console.error(err); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
