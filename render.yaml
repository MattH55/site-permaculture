services:
  - type: web
    name: resilience-quiz-edmonton
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Expanding Edge <info@expandingedge.ca>
      - key: MAIL_BCC
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-leads
          property: connectionString

databases:
  - name: quiz-leads
    plan: basic-256mb
