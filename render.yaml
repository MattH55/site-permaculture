services:
  - type: web
    name: resilience-quiz-edmonton
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Land resilience assessment <onboarding@resend.dev>
      - key: MAIL_BCC
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-leads
          property: connectionString

  - type: web
    name: ee-site-design
    runtime: node
    plan: free
    region: oregon
    rootDir: site-design
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: quiz-leads
    plan: basic-256mb
